# Kept enabled so anything that doesn't fit the four templates still has a way
# in.
blank_issues_enabled: true

contact_links:
  - name: Translating Agendula
    url: https://github.com/AieXile/Agendula/blob/main/CONTRIBUTING.md
    about: >-
      Translations are plain resource files in this repository, so adding or
      fixing one is a normal pull request — no separate translation platform.
      The contributing guide explains where they live and how to check them.

  - name: Contributing guide
    url: https://github.com/AieXile/Agendula/blob/main/CONTRIBUTING.md
    about: >-
      Before opening a pull request: how to build (there's a submodule), where
      code goes, and the one architectural rule a change is reviewed against.

  - name: Sync sources and scope
    url: https://github.com/AieXile/Agendula/blob/main/README.md
    about: >-
      Agendula keeps its own task store and can also work on top of the
      OpenTasks provider, so it works with DAVx5, SmoothSync, DecSync and
      friends. Google Tasks and Microsoft To Do are out of scope by design —
      check here before requesting a backend.
